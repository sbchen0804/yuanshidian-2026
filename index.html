<html lang="zh-TW">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-panel: #1e293b;
      --bg-card: #334155;
      --bg-card-hover: #3b4d66;
      --accent-blue: #38bdf8;
      --accent-blue-hover: #0284c7;
      --accent-red: #ef4444;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --border-color: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Nav */
    header {
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-tag {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .title-box h1 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
    }

    .title-box p {
      font-size: 12px;
      color: var(--text-sub);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-help {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-help:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-main);
    }

    /* Main Container */
    .app-body {
      display: flex;
      flex: 1;
      height: calc(100vh - 65px);
      overflow: hidden;
    }

    /* Left Sidebar: Segment Playlist */
    .sidebar {
      width: 460px;
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .filter-bar {
      padding: 14px 18px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .filter-chip {
      background: var(--bg-card);
      color: var(--text-sub);
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .filter-chip.active, .filter-chip:hover {
      background: var(--accent-blue-hover);
      color: #fff;
      border-color: var(--accent-blue);
    }

    .segment-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .segment-list::-webkit-scrollbar {
      width: 6px;
    }
    .segment-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .module-group-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 4px 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .segment-card {
      background-color: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .segment-card:hover {
      background-color: var(--bg-card-hover);
      border-color: var(--accent-blue);
      transform: translateY(-1px);
    }

    .segment-card.active {
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.35), rgba(15, 23, 42, 0.8));
      border: 1px solid var(--accent-blue);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .card-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .card-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
      flex: 1;
      line-height: 1.4;
    }

    .card-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--accent-gold);
      background: rgba(245, 158, 11, 0.12);
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 6px;
    }

    .card-quote {
      font-size: 11.5px;
      color: #cbd5e1;
      font-style: italic;
      background: rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      border-left: 3px solid var(--accent-gold);
      border-radius: 0 4px 4px 0;
      line-height: 1.4;
    }

    /* Right Player Area */
    .player-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #0b1120;
      overflow-y: auto;
      padding: 16px 24px;
      gap: 16px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-color);
    }

    .video-wrapper iframe, .video-wrapper #player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Status Bar below player */
    .player-status-bar {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .status-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-green);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-green);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .current-playing-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-tracker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.1);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .btn-action {
      background-color: var(--accent-blue-hover);
      color: #fff;
      border: none;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background-color: var(--accent-blue);
    }

    .btn-replay {
      background-color: #475569;
    }
    .btn-replay:hover {
      background-color: #64748b;
    }

    /* Teaching Keynote Cards under Player */
    .teaching-notes-card {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
    }

    .notes-header h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .notes-content {
      font-size: 13.5px;
      line-height: 1.7;
      color: #e2e8f0;
    }

    .notes-bullets {
      margin-left: 18px;
      margin-top: 6px;
    }

    .notes-bullets li {
      margin-bottom: 6px;
    }

    .quote-box {
      background: rgba(245, 158, 11, 0.08);
      border-left: 4px solid var(--accent-gold);
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
      font-size: 13px;
      color: #fed7aa;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <span class="badge-tag">2026 最新手法</span>
      <div class="title-box">
        <h1>張醫師原始點臀部按推重大改良 — 互動教學播放器</h1>
        <p>精選 15 組精準片段 | 點選即播 | 到達秒數自動停止定格 | 零相容性問題</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-help" onclick="toggleAutoNext()">⚡ 自動連續播放：<span id="autoNextLabel">關閉 (定格停止)</span></button>
      <a href="https://www.youtube.com/watch?v=jNKgLlgoJ7w" target="_blank" class="btn-help" style="text-decoration:none; display:inline-flex; align-items:center; gap:4px;">
        ↗ 開啟 YouTube 原影片
      </a>
    </div>
  </header>

  <!-- App Body -->
  <div class="app-body">
    <!-- Left Playlist Sidebar -->
    <div class="sidebar">
      <div class="filter-bar">
        <div class="filter-chip active" onclick="filterSegments('all', this)">全部重點 (15)</div>
        <div class="filter-chip" onclick="filterSegments('m1', this)">一、重大改良</div>
        <div class="filter-chip" onclick="filterSegments('m2', this)">二、點位架構</div>
        <div class="filter-chip" onclick="filterSegments('m3', this)">三、步法身法</div>

        <div class="filter-chip" onclick="filterSegments('m5', this)">五、痛點診斷</div>
      </div>

      <div class="segment-list" id="segmentListContainer">
        <!-- Segments dynamically populated -->
      </div>
    </div>

    <!-- Right Player & Teaching Notes -->
    <div class="player-area">
      <!-- YouTube Embed IFrame Wrapper -->
      <div class="video-wrapper">
        <div id="player"></div>
      </div>

      <!-- Live Status & Play Controls -->
      <div class="player-status-bar">

          <div class="current-playing-title" id="currentTitle">請選擇左側重點段落開始教學</div>
        </div>

        <div class="status-right">
          <div class="time-tracker" id="timeTracker">00:00 / 00:00</div>
          <button class="btn-action btn-replay" onclick="replayCurrentSegment()">↺ 重播此段</button>
          <button class="btn-action" onclick="togglePlayPause()" id="playPauseBtn">❚❚ 暫停</button>
        </div>
      </div>

      <!-- Detail Teaching Keynotes -->
      <div class="teaching-notes-card" id="notesCard">
        <div class="notes-header">
          <h3 id="notesHeaderTitle">📌 本段核心操作要點解析</h3>
          <span style="font-size:12px; color:var(--text-sub);" id="notesModuleTag">模組標籤</span>

        </div>
      </div>
    </div>
  </div>

  <!-- YouTube IFrame API -->

      {

    let player = null;
    let currentSegment = null;
    let checkInterval = null;
    let autoNext = false; // default: stop at end!
    let isApiReady = false;

    // Initialize YouTube Player
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: 'jNKgLlgoJ7w',
        playerVars: {
          playsinline: 1,
          rel: 0,
          modestbranding: 1
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      isApiReady = true;
      document.getElementById('statusText').innerText = '播放器已連線就緒，點擊任一卡片即可指定區間播放';
      renderSegmentList(segments);
      // Select first segment by default but don't autoplay yet
      selectSegment(segments[0], false);
    }

    function onPlayerStateChange(event) {
      const playPauseBtn = document.getElementById('playPauseBtn');
      const statusDot = document.getElementById('statusDot');
      
      if (event.data === YT.PlayerState.PLAYING) {
        playPauseBtn.innerText = '❚❚ 暫停';
        statusDot.style.backgroundColor = 'var(--accent-green)';
        document.getElementById('statusText').innerText = '正在播放指定教學區間...';
        startStopMonitor();
      } else if (event.data === YT.PlayerState.PAUSED) {
        playPauseBtn.innerText = '▶ 播放';
        statusDot.style.backgroundColor = 'var(--accent-gold)';
        document.getElementById('statusText').innerText = '已暫停';
        clearInterval(checkInterval);
      } else if (event.data === YT.PlayerState.ENDED) {
        clearInterval(checkInterval);
        onSegmentEnded();
      }
    }

    // Monitor playback time and automatically STOP at segment.end
    function startStopMonitor() {
      clearInterval(checkInterval);
      checkInterval = setInterval(() => {
        if (!player || !player.getCurrentTime || !currentSegment) return;
        
        const curr = player.getCurrentTime();
        updateTimeTracker(curr, currentSegment.end);

        // Check if reached segment end
        if (curr >= currentSegment.end) {
          player.pauseVideo();
          clearInterval(checkInterval);
          onSegmentEnded();
        }
      }, 200);
    }

    function onSegmentEnded() {
      const statusDot = document.getElementById('statusDot');
      statusDot.style.backgroundColor = 'var(--accent-red)';
      
      if (autoNext) {
        document.getElementById('statusText').innerText = '本段結束，即將自動切換下一段...';
        setTimeout(() => {
          playNextSegment();
        }, 1200);
      } else {
        document.getElementById('statusText').innerText = '🎯 已精準到達指定結束秒數，畫面已自動停止定格！';
      }
    }

    function playSegment(seg) {
      currentSegment = seg;
      updateUIForSegment(seg);
      
      if (player && player.seekTo) {
        player.seekTo(seg.start, true);
        player.playVideo();
      }
    }

    function selectSegment(seg, autoPlay = true) {
      currentSegment = seg;
      updateUIForSegment(seg);

      if (autoPlay && player && player.seekTo) {
        player.seekTo(seg.start, true);
        player.playVideo();
      }
    }

    function updateUIForSegment(seg) {
      // Highlight card in playlist
      document.querySelectorAll('.segment-card').forEach(el => el.classList.remove('active'));
      const activeCard = document.getElementById(`seg-card-${seg.id}`);
      if (activeCard) {
        activeCard.classList.add('active');
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      // Update current title & notes
      document.getElementById('currentTitle').innerText = `${seg.id}. ${seg.title}`;
      document.getElementById('notesHeaderTitle').innerText = `📌 ${seg.title}`;
      document.getElementById('notesModuleTag').innerText = seg.moduleName;
      document.getElementById('notesQuote').innerText = `💡 張醫師原音要領：${seg.quote}`;
      
      let bulletHtml = `<p style="margin-bottom:8px;">${seg.desc}</p><ul class="notes-bullets">`;
      seg.notes.forEach(n => {
        bulletHtml += `<li>${n}</li>`;
      });
      bulletHtml += '</ul>';
      document.getElementById('notesContent').innerHTML = bulletHtml;

      updateTimeTracker(seg.start, seg.end);
    }

    function updateTimeTracker(curr, end) {
      const formatTime = (s) => {
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
      };
      document.getElementById('timeTracker').innerText = `${formatTime(curr)} / ${formatTime(end)}`;
    }

    function replayCurrentSegment() {
      if (currentSegment && player) {
        player.seekTo(currentSegment.start, true);
        player.playVideo();
      }
    }

    function togglePlayPause() {
      if (!player || !player.getPlayerState) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function toggleAutoNext() {
      autoNext = !autoNext;
      const lbl = document.getElementById('autoNextLabel');
      if (autoNext) {
        lbl.innerText = '開啟 (連續放映)';
        lbl.style.color = 'var(--accent-green)';
      } else {
        lbl.innerText = '關閉 (播完定格停止)';
        lbl.style.color = 'var(--accent-gold)';
      }
    }

    function playNextSegment() {
      if (!currentSegment) return;
      const idx = segments.findIndex(s => s.id === currentSegment.id);
      if (idx !== -1 && idx + 1 < segments.length) {
        selectSegment(segments[idx + 1], true);
      }
    }

    // Render Playlist
    function renderSegmentList(dataList) {
      const container = document.getElementById('segmentListContainer');
      container.innerHTML = '';
      
      let lastModule = '';

      dataList.forEach(seg => {
        if (seg.module !== lastModule) {
          lastModule = seg.module;
          const modTitle = document.createElement('div');
          modTitle.className = 'module-group-title';
          modTitle.innerHTML = `<span>📂</span> ${seg.moduleName}`;
          container.appendChild(modTitle);
        }

        const card = document.createElement('div');
        card.className = 'segment-card';
        card.id = `seg-card-${seg.id}`;
        card.onclick = () => selectSegment(seg, true);

        card.innerHTML = `
          <div class="card-top">
            <span class="card-num">#${seg.id}</span>
            <div class="card-title">${seg.title}</div>
            <span class="card-time">${seg.timeLabel}</span>
          </div>
          <div class="card-desc">${seg.desc}</div>
          <div class="card-quote">${seg.quote}</div>
        `;

        container.appendChild(card);
      });
    }

    // Filter by module
    function filterSegments(modKey, chipEl) {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chipEl.classList.add('active');

      if (modKey === 'all') {
        renderSegmentList(segments);
      } else {
        const filtered = segments.filter(s => s.module === modKey);
        renderSegmentList(filtered);
      }

      if (currentSegment) {
        const c = document.getElementById(`seg-card-${currentSegment.id}`);
        if (c) c.classList.add('active');
      }
    }
  </script>
